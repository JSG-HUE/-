<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#9ec9da">
  <title>方块旷野</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Courier New", monospace;
      --ink: #20302b;
      --paper: #f4f0dc;
      --edge: #263d35;
      --green: #88b84b;
      --sun: #f4c94d;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #9ec9da; color: var(--ink); }
    button { color: inherit; font: inherit; }
    #game { position: fixed; inset: 0; }
    #game canvas { display: block; width: 100%; height: 100%; }
    .topbar {
      position: absolute; z-index: 2; top: 18px; left: 20px; right: 20px;
      display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none;
    }
    .brand { display: flex; align-items: center; gap: 11px; text-shadow: 1px 2px 0 #fff8; }
    .brand-mark { width: 37px; height: 37px; border: 3px solid var(--edge); background: linear-gradient(135deg,#a8d75c 0 50%,#6e9e3b 50%); box-shadow: 3px 3px 0 #253b35; }
    .brand h1 { margin: 0; font-size: 19px; line-height: 1; letter-spacing: 0; }
    .brand small { display: block; margin-top: 5px; font-size: 10px; font-weight: 700; opacity: .75; }
    .world-tag { border: 2px solid var(--edge); padding: 8px 11px; background: #f4f0dce8; box-shadow: 3px 3px 0 #263d3566; font-size: 11px; font-weight: 700; }
    .world-tag span { color: #557a37; }
    .center-mark { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; transform: translate(-50%,-50%); pointer-events: none; }
    .center-mark::before, .center-mark::after { content: ""; position: absolute; background: #fff; box-shadow: 1px 1px #253b35; }
    .center-mark::before { width: 2px; height: 16px; left: 8px; top: 1px; }
    .center-mark::after { height: 2px; width: 16px; top: 8px; left: 1px; }
    .status {
      position: absolute; left: 20px; bottom: 104px; padding: 9px 12px; min-width: 180px;
      border: 2px solid var(--edge); background: #f4f0dce8; box-shadow: 3px 3px 0 #263d3566;
      font-size: 11px; line-height: 1.6; pointer-events: none;
    }
    .status strong { color: #537c35; }
    .hotbar {
      position: absolute; left: 50%; bottom: 19px; transform: translateX(-50%);
      display: flex; gap: 5px; padding: 6px; border: 3px solid var(--edge);
      background: #263d35dc; box-shadow: 4px 4px 0 #17272266;
    }
    .slot { position: relative; width: 58px; height: 58px; border: 2px solid #718076; background: #e9e4ce; display: grid; place-items: center; cursor: pointer; transition: transform .12s, background .12s; }
    .slot:hover { transform: translateY(-4px); }
    .slot.active { outline: 3px solid var(--sun); border-color: #fff5c9; background: #fff8df; transform: translateY(-5px); }
    .slot b { position: absolute; top: 2px; left: 4px; font-size: 10px; opacity: .7; }
    .swatch { width: 25px; height: 25px; border: 2px solid #28352d; box-shadow: inset -4px -4px #0002, inset 3px 3px #fff3; image-rendering: pixelated; }
    .slot small { position: absolute; bottom: 2px; font-size: 8px; font-weight: 700; }
    .controls {
      position: absolute; right: 20px; bottom: 104px; padding: 10px 12px;
      background: #f4f0dce8; border: 2px solid var(--edge); box-shadow: 3px 3px 0 #263d3566;
      font-size: 10px; line-height: 1.8; pointer-events: none;
    }
    .controls b { display: inline-block; min-width: 45px; color: #4e7134; }
    .overlay { position: absolute; z-index: 3; inset: 0; display: grid; place-items: center; background: #24352f4d; }
    .dialog { width: min(390px, calc(100vw - 32px)); padding: 24px; border: 3px solid var(--edge); background: var(--paper); box-shadow: 7px 7px 0 #17272280; text-align: center; }
    .dialog .cube-logo { width: 54px; height: 54px; margin: 0 auto 13px; border: 3px solid var(--edge); background: linear-gradient(135deg,#b3da67 0 48%,#84b24b 49% 70%,#816243 71%); box-shadow: 4px 4px 0 #263d35; }
    .dialog h2 { margin: 0 0 8px; font-size: 22px; }
    .dialog p { margin: 0 auto 18px; max-width: 290px; font-size: 12px; line-height: 1.7; color: #52635a; }
    .primary { border: 2px solid var(--edge); padding: 11px 18px; background: var(--green); box-shadow: 3px 3px 0 var(--edge); font-size: 13px; font-weight: 700; cursor: pointer; }
    .primary:hover { background: #a4d25d; transform: translateY(-1px); }
    .secondary { display: block; margin: 14px auto 0; padding: 5px; border: 0; background: transparent; text-decoration: underline; font-size: 10px; cursor: pointer; opacity: .72; }
    .toast { position: absolute; top: 75px; left: 50%; transform: translate(-50%,-10px); padding: 8px 13px; border: 2px solid var(--edge); background: #f4f0dced; font-size: 11px; opacity: 0; transition: .2s; pointer-events: none; }
    .toast.show { transform: translate(-50%,0); opacity: 1; }
    .mobile-note { display: none; }
    @media (max-width: 600px) {
      .topbar { top: 12px; left: 12px; right: 12px; }
      .world-tag { font-size: 9px; padding: 6px; }
      .brand h1 { font-size: 15px; }
      .status { left: 12px; bottom: 96px; min-width: auto; font-size: 9px; }
      .controls { right: 12px; bottom: 96px; font-size: 9px; }
      .slot { width: min(12vw, 48px); height: min(12vw, 48px); }
      .hotbar { bottom: 12px; gap: 3px; padding: 4px; }
      .slot small { font-size: 7px; }
    }
  </style>
</head>
<body>
  <main id="game" aria-label="方块旷野游戏画面">
    <header class="topbar">
      <div class="brand"><div class="brand-mark"></div><div><h1>方块旷野</h1><small>BLOCK WILDS · 创造模式</small></div></div>
      <div class="world-tag">世界 01　<span>晴朗 · 白昼</span></div>
    </header>
    <div class="center-mark" aria-hidden="true"></div>
    <div class="status">位置 <strong id="coordinates">0, 0, 0</strong><br>手持 <strong id="held-name">草方块</strong></div>
    <div class="controls"><div><b>W A S D</b> 移动</div><div><b>空格</b> 跳跃</div><div><b>左键</b> 挖掘</div><div><b>右键</b> 放置</div><div><b>1 - 6</b> 选择方块</div><div><b>ESC</b> 暂停</div></div>
    <nav class="hotbar" aria-label="方块快捷栏"></nav>
    <div class="toast" id="toast"></div>
    <section class="overlay" id="overlay">
      <div class="dialog">
        <div class="cube-logo"></div>
        <h2>踏进方块旷野</h2>
        <p>一片由你亲手改造的天地。走进旷野，挖下一块方块，再把它放在想要的地方。</p>
        <button class="primary" id="start-button">进入世界</button>
        <button class="secondary" id="reset-button">重新生成世界</button>
      </div>
    </section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (() => {
      const container = document.querySelector('#game');
      const overlay = document.querySelector('#overlay');
      const startButton = document.querySelector('#start-button');
      const resetButton = document.querySelector('#reset-button');
      const toast = document.querySelector('#toast');
      const coordinateLabel = document.querySelector('#coordinates');
      const heldName = document.querySelector('#held-name');
      const hotbar = document.querySelector('.hotbar');

      const blockTypes = [
        { id: 'grass', name: '草方块', color: 0x85b84a },
        { id: 'dirt', name: '泥土', color: 0x936b45 },
        { id: 'stone', name: '石头', color: 0x929998 },
        { id: 'wood', name: '橡木', color: 0x9a7043 },
        { id: 'leaves', name: '树叶', color: 0x4f8d48 },
        { id: 'sand', name: '沙子', color: 0xd8c17a }
      ];
      const palette = new Map(blockTypes.map(type => [type.id, new THREE.MeshLambertMaterial({ color: type.color })]));
      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const raycaster = new THREE.Raycaster();
      raycaster.far = 6;
      const world = new Map();
      const meshes = new Map();
      const keys = new Set();
      const player = { x: 0, y: 5, z: 0, velocityY: 0, yaw: 0, pitch: 0, grounded: false };
      let selected = 0;
      let locked = false;
      let playing = false;
      const fileMode = location.protocol === 'file:';
      let lastTime = 0;
      let toastTimer;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x9ec9da);
      scene.fog = new THREE.Fog(0x9ec9da, 18, 48);
      const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 90);
      camera.rotation.order = 'YXZ';
      const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.prepend(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xe8f7ff, 0x64724a, 1.55));
      const sun = new THREE.DirectionalLight(0xffefc3, 1.75);
      sun.position.set(-12, 24, 9);
      scene.add(sun);

      function keyOf(x, y, z) { return `${x},${y},${z}`; }
      function addBlock(x, y, z, type, decorate = false) {
        const key = keyOf(x, y, z);
        if (world.has(key)) return;
        world.set(key, type);
        const mesh = new THREE.Mesh(geometry, palette.get(type));
        mesh.position.set(x, y, z);
        mesh.userData = { x, y, z, type };
        scene.add(mesh);
        meshes.set(key, mesh);
        if (decorate) mesh.userData.natural = true;
      }
      function removeBlock(x, y, z) {
        const key = keyOf(x, y, z);
        const mesh = meshes.get(key);
        if (!mesh) return;
        scene.remove(mesh);
        meshes.delete(key);
        world.delete(key);
      }
      function heightAt(x, z) {
        return 2 + Math.floor((Math.sin(x * 0.32) + Math.cos(z * 0.27) + Math.sin((x + z) * 0.18)) * 0.55 + 1.1);
      }
      function makeTree(x, z, base) {
        for (let y = base; y < base + 4; y++) addBlock(x, y, z, 'wood', true);
        for (let dx = -2; dx <= 2; dx++) for (let dz = -2; dz <= 2; dz++) {
          for (let dy = 2; dy <= 4; dy++) {
            if (Math.abs(dx) + Math.abs(dz) + Math.max(0, dy - 3) < 4 && !(dx === 0 && dz === 0 && dy < 4)) addBlock(x + dx, base + dy, z + dz, 'leaves', true);
          }
        }
      }
      function generateWorld() {
        for (const mesh of meshes.values()) scene.remove(mesh);
        meshes.clear();
        world.clear();
        for (let x = -14; x <= 14; x++) for (let z = -14; z <= 14; z++) {
          const height = heightAt(x, z);
          for (let y = -2; y < height; y++) {
            const type = y === height - 1 ? 'grass' : y >= height - 3 ? 'dirt' : 'stone';
            addBlock(x, y, z, type);
          }
        }
        for (const [x, z] of [[-7,-5], [7,-7], [-8,7], [8,6], [3,10], [-11,1]]) makeTree(x, z, heightAt(x, z));
        player.x = 0;
        player.z = 0;
        player.y = heightAt(0, 0) + 1.62;
        player.velocityY = 0;
        showToast('旷野已经准备好了');
      }
      function buildHotbar() {
        hotbar.innerHTML = '';
        blockTypes.forEach((type, index) => {
          const slot = document.createElement('button');
          slot.className = `slot${index === selected ? ' active' : ''}`;
          slot.type = 'button';
          slot.title = `${index + 1} · ${type.name}`;
          slot.setAttribute('aria-label', slot.title);
          slot.innerHTML = `<b>${index + 1}</b><span class="swatch" style="background:#${type.color.toString(16).padStart(6,'0')}"></span><small>${type.name}</small>`;
          slot.addEventListener('click', () => selectBlock(index));
          hotbar.append(slot);
        });
        heldName.textContent = blockTypes[selected].name;
      }
      function selectBlock(index) {
        selected = (index + blockTypes.length) % blockTypes.length;
        buildHotbar();
      }
      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1300);
      }
      function hitBlock() {
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const hits = raycaster.intersectObjects(Array.from(meshes.values()), false);
        return hits[0] || null;
      }
      function mineBlock() {
        const hit = hitBlock();
        if (!hit) return;
        const { x, y, z } = hit.object.userData;
        removeBlock(x, y, z);
        showToast(`挖掘了${blockTypes.find(type => type.id === hit.object.userData.type)?.name || '方块'}`);
      }
      function placeBlock() {
        const hit = hitBlock();
        if (!hit || !hit.face) return;
        const { x, y, z } = hit.object.userData;
        const normal = hit.face.normal;
        const px = x + Math.round(normal.x);
        const py = y + Math.round(normal.y);
        const pz = z + Math.round(normal.z);
        const playerMinX = player.x - 0.28, playerMaxX = player.x + 0.28;
        const playerMinZ = player.z - 0.28, playerMaxZ = player.z + 0.28;
        const playerMinY = player.y - 1.62, playerMaxY = player.y + 0.18;
        if (px + 0.5 > playerMinX && px - 0.5 < playerMaxX && pz + 0.5 > playerMinZ && pz - 0.5 < playerMaxZ && py + 0.5 > playerMinY && py - 0.5 < playerMaxY) {
          showToast('这里离你太近了');
          return;
        }
        addBlock(px, py, pz, blockTypes[selected].id);
      }
      function collidesAt(x, y, z) {
        const minX = Math.floor(x - 0.28), maxX = Math.floor(x + 0.28);
        const minZ = Math.floor(z - 0.28), maxZ = Math.floor(z + 0.28);
        const feet = y - 1.62, head = y + 0.12;
        for (let bx = minX; bx <= maxX; bx++) for (let bz = minZ; bz <= maxZ; bz++) {
          for (let by = Math.floor(feet - 0.02); by <= Math.floor(head); by++) {
            if (world.has(keyOf(bx, by, bz)) && feet < by + 0.5 && head > by - 0.5) return true;
          }
        }
        return false;
      }
      function updatePlayer(delta) {
        const speed = keys.has('Shift') ? 7.5 : 5;
        const forward = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
        const sideways = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
        const length = Math.hypot(forward, sideways) || 1;
        const moveX = (Math.sin(player.yaw) * forward + Math.cos(player.yaw) * sideways) / length * speed * delta;
        const moveZ = (-Math.cos(player.yaw) * forward + Math.sin(player.yaw) * sideways) / length * speed * delta;
        if (!collidesAt(player.x + moveX, player.y, player.z)) player.x += moveX;
        if (!collidesAt(player.x, player.y, player.z + moveZ)) player.z += moveZ;
        player.velocityY -= 22 * delta;
        const nextY = player.y + player.velocityY * delta;
        if (!collidesAt(player.x, nextY, player.z)) {
          player.y = nextY;
          player.grounded = false;
        } else if (player.velocityY < 0) {
          player.y = Math.floor(player.y - 1.62 - 0.01) + 1 + 1.62;
          player.velocityY = 0;
          player.grounded = true;
        } else {
          player.velocityY = 0;
        }
        if (player.y < -8) {
          player.x = 0;
          player.z = 0;
          player.y = heightAt(0, 0) + 1.62;
          player.velocityY = 0;
          showToast('已回到旷野中心');
        }
        camera.position.set(player.x, player.y, player.z);
        camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
        coordinateLabel.textContent = `${Math.floor(player.x)}, ${Math.floor(player.y - 1.62)}, ${Math.floor(player.z)}`;
      }
      function requestLock() {
        if (fileMode || !renderer.domElement.requestPointerLock) {
          playing = true;
          overlay.style.display = 'none';
          showToast('移动鼠标调整视角，按 ESC 暂停');
          return;
        }
        renderer.domElement.requestPointerLock();
      }

      startButton.addEventListener('click', requestLock);
      resetButton.addEventListener('click', () => { generateWorld(); requestLock(); });
      renderer.domElement.addEventListener('click', () => { if (!locked) requestLock(); });
      document.addEventListener('pointerlockchange', () => {
        locked = document.pointerLockElement === renderer.domElement;
        playing = locked;
        overlay.style.display = playing ? 'none' : 'grid';
      });
      document.addEventListener('mousemove', event => {
        if (!playing) return;
        player.yaw -= event.movementX * 0.0022;
        player.pitch = Math.max(-1.48, Math.min(1.48, player.pitch - event.movementY * 0.0022));
      });
      document.addEventListener('keydown', event => {
        keys.add(event.code);
        if (event.code === 'Escape' && fileMode && playing) {
          playing = false;
          keys.clear();
          overlay.style.display = 'grid';
        }
        if (event.code.startsWith('Digit')) {
          const number = Number(event.code.slice(5));
          if (number >= 1 && number <= blockTypes.length) selectBlock(number - 1);
        }
        if (event.code === 'Space' && player.grounded) {
          event.preventDefault();
          player.velocityY = 8.2;
          player.grounded = false;
        }
      });
      document.addEventListener('keyup', event => keys.delete(event.code));
      document.addEventListener('mousedown', event => {
        if (!playing) return;
        if (event.button === 0) mineBlock();
        if (event.button === 2) placeBlock();
      });
      document.addEventListener('contextmenu', event => event.preventDefault());
      window.addEventListener('blur', () => keys.clear());
      window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
      });
      function animate(time) {
        requestAnimationFrame(animate);
        const delta = Math.min((time - lastTime) / 1000 || 0, 0.04);
        lastTime = time;
        if (playing) updatePlayer(delta);
        renderer.render(scene, camera);
      }
      buildHotbar();
      generateWorld();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
